[package]
name = "local-music"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
directories = "6"
lofty = "0.22"
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "24386a253984270e30339579eaaab808e64c8802", features = ["native-file-dialog"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
hound = "3"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16

[lints.clippy]
await_holding_lock = "deny"

[lints.rust]
unsafe_code = "forbid"
